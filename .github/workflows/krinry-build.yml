name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, profile, release]
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, apk-split]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android --org com.alaa --project-name hosting .

      - name: Set app label to HOST PANEL
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="HOST PANEL"', s, count=1)
          p.write_text(s)
          print('OK label')
          PY

      - name: Generate app icons from PNG
        run: dart run flutter_launcher_icons

      # ============================================================
      # 🔐 SETUP KEYSTORE (STABLE SIGNATURE)
      # ============================================================
      - name: Setup stable keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/hosting.jks
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=hosting.jks
          PROPS
          echo "✅ Keystore ready"
          ls -lh android/app/hosting.jks

      - name: Patch build.gradle for release signing
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()

          # 1) Load keystore properties
          if 'keystoreProperties' not in s:
              s = s.replace(
                  'android {',
                  '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {''',
                  1
              )

          # 2) Add signingConfigs block
          if 'signingConfigs {' not in s:
              s = s.replace(
                  'buildTypes {',
                  '''signingConfigs {
                      release {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
                  buildTypes {''',
                  1
              )

          # 3) Use release signing
          s = s.replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release'
          )

          p.write_text(s)
          print('✅ build.gradle patched')
          PY

      - name: Inject MainActivity.kt (native security + signature check)
        run: |
          MAIN_KT=android/app/src/main/kotlin/com/alaa/hosting/MainActivity.kt
          mkdir -p "$(dirname "$MAIN_KT")"
          cat > "$MAIN_KT" << 'KOT'
          package com.alaa.hosting

          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import android.os.Debug
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.net.URL
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.security.MessageDigest
          import kotlin.concurrent.thread

          class MainActivity : FlutterActivity() {
              private val CH = "hosting/security"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CH)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "isVpnActive" -> result.success(isVpnActive())
                              "hasVpnInterface" -> result.success(false)
                              "hasVpnRoute" -> result.success(false)
                              "hasSuspiciousDns" -> result.success(false)
                              "hasVpnApp" -> result.success(false)
                              "getHttpProxy" -> result.success(getHttpProxy())
                              "getRunningProcs" -> result.success(getRunningProcs())
                              "hasUserCaInstalled" -> result.success(false)
                              "getApkSignatureSha256" -> result.success(getApkSignatureSha256())
                              "isRooted" -> result.success(isRooted())
                              "isFridaRunning" -> result.success(isFridaRunning())
                              "hasXposed" -> result.success(hasXposed())
                              "isDebuggable" -> result.success(isDebuggable())
                              "verifyNativeSignature" -> verifyNativeSignatureAsync(result)
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun verifyNativeSignatureAsync(result: MethodChannel.Result) {
                  thread {
                      try {
                          val localSig = getApkSignatureSha256()?.replace(":", "")?.lowercase()
                          if (localSig.isNullOrEmpty()) {
                              result.success(false)
                              return@thread
                          }
                          val url = URL("https://raw.githubusercontent.com/Alaa537/hosting-sec/main/signature.json")
                          val conn = url.openConnection()
                          conn.connectTimeout = 5000
                          conn.readTimeout = 5000
                          val jsonText = conn.getInputStream().bufferedReader().use { it.readText() }
                          val sha256Regex = """ "sha256"\s*:\s*"([^"]+)" """.toRegex()
                          val match = sha256Regex.find(jsonText)
                          val remoteSig = match?.groupValues?.get(1)?.replace(":", "")?.lowercase()
                          if (remoteSig.isNullOrEmpty()) {
                              result.success(false)
                              return@thread
                          }
                          result.success(localSig == remoteSig)
                      } catch (e: Exception) {
                          result.success(false)
                      }
                  }
              }

              private fun isVpnActive(): Boolean = try {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val active = cm.activeNetwork ?: return false
                      val caps = cm.getNetworkCapabilities(active) ?: return false
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                  } else false
              } catch (_: Exception) { false }

              private fun getHttpProxy(): String? = try {
                  val h = System.getProperty("http.proxyHost")
                  val p = System.getProperty("http.proxyPort")
                  if (!h.isNullOrEmpty()) "$h:$p" else null
              } catch (_: Exception) { null }

              private fun getRunningProcs(): String = try {
                  val sb = StringBuilder()
                  File("/proc").listFiles()?.forEach { f ->
                      if (f.name.all { it.isDigit() }) {
                          val cmd = File(f, "cmdline")
                          if (cmd.exists()) try { sb.append(cmd.readText()).append('\n') } catch (_: Exception) {}
                      }
                  }
                  sb.toString()
              } catch (_: Exception) { "" }

              private fun isRooted(): Boolean {
                  val paths = listOf("/system/app/Superuser.apk", "/sbin/su", "/system/bin/su", "/system/xbin/su", "/data/local/su")
                  if (paths.any { File(it).exists() }) return true
                  val pkgs = listOf("com.topjohnwu.magisk", "com.noshufou.android.su", "eu.chainfire.supersu")
                  return pkgs.any { try { packageManager.getPackageInfo(it, 0); true } catch (_: Exception) { false } }
              }

              private fun isFridaRunning(): Boolean {
                  for (port in listOf(27042, 27043)) {
                      try { val s = Socket(); s.connect(InetSocketAddress("127.0.0.1", port), 80); s.close(); return true } catch (_: Exception) {}
                  }
                  try {
                      val f = File("/proc/self/maps")
                      if (f.exists() && f.readText().lowercase().contains("frida")) return true
                  } catch (_: Exception) {}
                  return false
              }

              private fun hasXposed(): Boolean = try {
                  javaClass.classLoader?.loadClass("de.robv.android.xposed.XposedBridge") != null
              } catch (_: Exception) { File("/system/framework/XposedBridge.jar").exists() }

              private fun isDebuggable(): Boolean = try {
                  (applicationInfo.flags and android.content.pm.ApplicationInfo.FLAG_DEBUGGABLE) != 0 ||
                  Debug.isDebuggerConnected() || Debug.waitingForDebugger()
              } catch (_: Exception) { false }

              private fun getApkSignatureSha256(): String? = try {
                  val pm = packageManager
                  val info = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      pm.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                  } else {
                      @Suppress("DEPRECATION") pm.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                  }
                  val sigs = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      info.signingInfo?.apkContentsSigners
                  } else {
                      @Suppress("DEPRECATION") info.signatures
                  }
                  val sig = sigs?.firstOrNull() ?: return null
                  MessageDigest.getInstance("SHA-256").digest(sig.toByteArray()).joinToString(":") { "%02X".format(it) }
              } catch (_: Exception) { null }
          }
          KOT

      - name: Inject permissions into AndroidManifest
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
          '''
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'requestLegacyExternalStorage' not in s:
              s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(s)
          PY

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          FLAGS="--obfuscate --split-debug-info=build/symbols"
          if [ "$OUT" = "apk" ]; then
            flutter build apk --$TYPE $FLAGS
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE $FLAGS --split-per-abi
          elif [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE $FLAGS
          fi

      - name: Upload symbols (private)
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-private
          path: build/symbols/
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
