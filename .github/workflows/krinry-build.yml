name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, profile, release]
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, apk-split]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android --org com.alaa --project-name hosting .

      - name: Set app label to HOST PANEL
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          # Change android:label to HOST PANEL
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="HOST PANEL"', s, count=1)
          p.write_text(s)
          print('✓ label = HOST PANEL')
          PY

      - name: Generate app icons from PNG
        run: dart run flutter_launcher_icons

      - name: Inject MainActivity.kt (native security)
        run: |
          MAIN_KT=android/app/src/main/kotlin/com/alaa/hosting/MainActivity.kt
          mkdir -p "$(dirname "$MAIN_KT")"
          cat > "$MAIN_KT" << 'KOT'
          package com.alaa.hosting

          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileReader
          import java.security.MessageDigest

          class MainActivity : FlutterActivity() {
              private val CH = "hosting/security"

              private val VPN_PKGS = listOf(
                  "com.wireguard.android", "net.openvpn.openvpn",
                  "com.openvpn.openvpn", "de.blinkt.openvpn",
                  "com.nordvpn.android", "com.expressvpn.vpn",
                  "com.protonvpn.android", "com.surfshark.vpnclient.android",
                  "com.privateinternetaccess.android", "com.psiphon3",
                  "org.torproject.torbrowser", "org.torproject.android",
                  "com.cloudflare.onedotonedotonedotone",
                  "com.tailscale.ipn", "com.windscribe.vpn",
                  "com.hotspotshield.vpn", "com.tunnelbear.android",
                  "free.vpn.unblock.proxy.turbovpn", "com.vpn.free.proxy",
                  "io.psiphon", "com.vpnhood.vpnclient",
                  "com.anonytun.android", "com.anyconnect",
                  "com.cisco.anyconnect.vpn.android.avf",
                  "com.turbo.vpn", "com.vpn.proxy.master",
                  "com.free.vpn.super", "com.vpn.unlimited"
              )

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CH)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "isVpnActive"        -> result.success(isVpnActive())
                              "hasVpnInterface"    -> result.success(hasVpnInterface())
                              "hasVpnRoute"        -> result.success(hasVpnRoute())
                              "hasSuspiciousDns"   -> result.success(hasSuspiciousDns())
                              "hasVpnApp"          -> result.success(hasVpnApp())
                              "getHttpProxy"       -> result.success(getHttpProxy())
                              "getRunningProcs"    -> result.success(getRunningProcs())
                              "hasUserCaInstalled" -> result.success(hasUserCaInstalled())
                              "getApkSignatureSha256" -> result.success(getApkSignatureSha256())
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun isVpnActive(): Boolean = try {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val net = cm.activeNetwork ?: return false
                      val caps = cm.getNetworkCapabilities(net) ?: return false
                      if (caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) return true
                      if (!caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)) return true
                  }
                  false
              } catch (_: Exception) { false }

              private fun hasVpnInterface(): Boolean = try {
                  java.net.NetworkInterface.getNetworkInterfaces().toList().any {
                      val n = it.name.lowercase()
                      n.startsWith("tun") || n.startsWith("tap") ||
                      n.startsWith("ppp") || n.startsWith("wg") ||
                      n.startsWith("utun")
                  }
              } catch (_: Exception) { false }

              private fun hasVpnRoute(): Boolean = try {
                  val f = File("/proc/net/route")
                  if (!f.exists()) return false
                  BufferedReader(FileReader(f)).use { r ->
                      r.readLine()
                      var line = r.readLine()
                      while (line != null) {
                          val parts = line.split("\t", " ")
                              .filter { it.isNotBlank() }
                          if (parts.size >= 2) {
                              val iface = parts[0].lowercase()
                              val dest  = parts[1]
                              if (dest == "00000000" &&
                                  (iface.startsWith("tun") || iface.startsWith("ppp") ||
                                   iface.startsWith("wg")  || iface.startsWith("tap"))) {
                                  return true
                              }
                          }
                          line = r.readLine()
                      }
                  }
                  false
              } catch (_: Exception) { false }

              private fun hasSuspiciousDns(): Boolean = try {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val net = cm.activeNetwork ?: return false
                  val lp = cm.getLinkProperties(net) ?: return false
                  lp.dnsServers.any { a ->
                      val ip = a.hostAddress ?: return@any false
                      ip.startsWith("10.")    || ip.startsWith("127.") ||
                      ip.startsWith("192.168.") || ip.startsWith("172.")
                  }
              } catch (_: Exception) { false }

              private fun hasVpnApp(): Boolean = try {
                  val pm = packageManager
                  val installed = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                  installed.any { app ->
                      val pkg = app.packageName.lowercase()
                      VPN_PKGS.any { pkg.contains(it.lowercase()) }
                  }
              } catch (_: Exception) { false }

              private fun getHttpProxy(): String? = try {
                  val h = System.getProperty("http.proxyHost")
                  val p = System.getProperty("http.proxyPort")
                  if (!h.isNullOrEmpty()) "$h:$p" else null
              } catch (_: Exception) { null }

              private fun getRunningProcs(): String = try {
                  val sb = StringBuilder()
                  File("/proc").listFiles()?.forEach { f ->
                      if (f.name.all { it.isDigit() }) {
                          val cmd = File(f, "cmdline")
                          if (cmd.exists()) try {
                              sb.append(cmd.readText()).append('\n')
                          } catch (_: Exception) {}
                      }
                  }
                  sb.toString()
              } catch (_: Exception) { "" }

              private fun hasUserCaInstalled(): Boolean = try {
                  val f = File("/data/misc/user/0/cacerts-added")
                  f.exists() && (f.listFiles()?.isNotEmpty() == true)
              } catch (_: Exception) { false }

              private fun getApkSignatureSha256(): String? = try {
                  val pm = packageManager
                  val info = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      pm.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                  } else {
                      @Suppress("DEPRECATION")
                      pm.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                  }
                  val sigs = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      info.signingInfo?.apkContentsSigners
                  } else {
                      @Suppress("DEPRECATION")
                      info.signatures
                  }
                  val sig = sigs?.firstOrNull() ?: return null
                  MessageDigest.getInstance("SHA-256").digest(sig.toByteArray())
                      .joinToString(":") { "%02X".format(it) }
              } catch (_: Exception) { null }
          }
          KOT

      - name: Inject permissions into AndroidManifest
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
          '''
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'requestLegacyExternalStorage' not in s:
              s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          p.write_text(s)
          print('✓ manifest patched')
          PY

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          if [ "$OUT" = "apk" ]; then
            flutter build apk --$TYPE
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi
          elif [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
