name: hosting
description: Hosting API terminal client - Flutter edition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  package_info_plus: ^8.1.1
  crypto: ^3.0.5
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
